[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "czmeltbench"
version = "0.1.0"
description = "Scientific machine learning dataset for Czochralski melt flow"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
